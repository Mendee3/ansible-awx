---
# Install from local files (path on the Ansible control node / AWX EE).
# Takes priority over URL if set.
splunk_uf_local_rpm: ""   # e.g. splunkforwarder-10.4.0-f798d4d49089.x86_64.rpm
splunk_uf_local_deb: ""   # e.g. splunkforwarder-10.4.0-f798d4d49089-linux-amd64.deb

# Install from URL (used only when local file variables above are empty).
# Get the correct URLs from: https://www.splunk.com/en_us/download/universal-forwarder.html
splunk_uf_rpm_url: ""
splunk_uf_deb_url: ""

splunk_install_dir: /opt/splunkforwarder
splunk_user: splunk
splunk_group: splunk

# REQUIRED: Set this to your Splunk indexer IP or hostname
splunk_indexer_host: "172.18.9.12"
splunk_indexer_port: "9997"

splunk_index_linux: "linux"
splunk_index_audit: "linux_audit"
